name: Automatic Blogger Post Push Notifier

on:
  schedule:
    - cron: '*/5 * * * *' # Runs automatically every 5 minutes 24x7
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Automatic Blogger Push Notifier Engine
        run: |
          python auto_fcm_notifier.py || python ../auto_fcm_notifier.py || echo "Finished check."
